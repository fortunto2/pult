[project]
name = "pult"
version = "0.1.0"
description = "A Telegram remote for Claude Code: queue, cards, sessions, live channel. The shared core; extensions plug in."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []   # the Mac-side tools are stdlib only

[project.scripts]
pult-run = "pult.runner:cli"
session-run = "pult.session_run:cli"
bot-item = "pult.items:cli"
bot-say = "pult.say:cli"
tg-channel = "pult.channel:cli"
live-session = "pult.live_session:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pult"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests/plugins"]

[tool.ruff]
line-length = 180
target-version = "py313"
extend-exclude = ["worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731", "E402", "B008"]
